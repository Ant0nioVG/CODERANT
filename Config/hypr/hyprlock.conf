# ============================================================
# Hyprlock - lockscreen configuration
# Colors are sourced from the dynamically generated palette.
# Elements: background, clock, date, greeting, caps indicator,
# password input, and fade animations.
# ============================================================

# Colors sourced from the dynamic matugen palette
source = ~/.config/hypr/splits/colors-hyprlock.conf

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

# ============================================================
# Main clock - updates every second
# ============================================================
label {
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = $primary
    font_size = 90
    font_family = Cascadia Code
    position = 0, 160
    halign = center
    valign = center
}

# ============================================================
# Date display - updates every hour
# ============================================================
label {
    text = cmd[update:3600] echo "$(date +'%A, %B %d')"
    color = $on_surface
    font_size = 20
    font_family = Cascadia Code
    position = 0, 60
    halign = center
    valign = center
}

# ============================================================
# Greeting / user name - updates daily
# ============================================================
label {
    text = cmd[update:86400] echo "Hello, $(whoami)"
    color = $on_surface_variant
    font_size = 16
    font_family = Cascadia Code
    position = 0, -20
    halign = center
    valign = bottom
}

# ============================================================
# Caps lock indicator
# ============================================================
label {
    text = cmd[update:500] bash -c "grep -qs '1' /sys/class/leds/input*::capslock/brightness 2>/dev/null && echo 'CAPS LOCK ON' || echo ''"
    color = $error
    font_size = 12
    font_family = Cascadia Code
    position = 0, -130
    halign = center
    valign = center
}

# ============================================================
# Password input field
# ============================================================
input-field {
    size = 300, 50
    font_size = 50
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $outline
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fail_text = <i>Incorrect password</i>
    fade_on_empty = true
    font_family = Cascadia Code
    placeholder_text = <i><span foreground="#eedfe399">Password</span></i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# ============================================================
# Fade animations
# ============================================================
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 2, linear
}
