# ============================================================
# Matugen template: Kitty terminal theme colors
# Included by kitty.conf via: include themes/matugen-theme.conf
# ============================================================

foreground            {{colors.on_background.default.hex}}
selection_foreground  {{colors.on_primary.default.hex}}
selection_background  {{colors.primary.default.hex}}
url_color             {{colors.tertiary.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

# Dark palette (ANSI 0-7)
color0 {{colors.surface_container_low.default.hex}}
color1 {{colors.error_container.default.hex}}
color2 {{colors.secondary_fixed_dim.default.hex}}
color3 {{colors.tertiary_fixed_dim.default.hex}}
color4 {{colors.primary_container.default.hex}}
color5 {{colors.secondary_container.default.hex}}
color6 {{colors.tertiary_container.default.hex}}
color7 {{colors.on_background.default.hex}}

# Light palette (ANSI 8-15)
color8 {{colors.surface_dim.default.hex}}
color9 {{colors.error.default.hex}}
color10 {{colors.secondary_fixed.default.hex}}
color11 {{colors.tertiary_fixed.default.hex}}
color12 {{colors.primary.default.hex}}
color13 {{colors.secondary.default.hex}}
color14 {{colors.tertiary.default.hex}}
color15 {{colors.on_surface.default.hex}}

# Tab bar
tab_bar_background              #000000
tab_bar_margin_color            #000000
active_tab_foreground           {{colors.on_primary.default.hex}}
active_tab_background           {{colors.primary.default.hex}}
inactive_tab_foreground         {{colors.on_surface_variant.default.hex}}
inactive_tab_background         {{colors.surface.default.hex}}
